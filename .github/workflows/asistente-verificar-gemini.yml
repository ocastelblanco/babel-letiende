name: Asistente - verificar contrato de Gemini

# Llama a la API real de Gemini con textos sintéticos: primero el contrato HTTP
# (modelos, embeddings, Interactions API) y luego la clase real `ProveedorGemini`
# que usa el asistente (T-0021, T-0024), y por último el prompt vigente con el contexto real que arma la
# Lambda (T-0030: caso del horario inventado). Usa el secreto GEMINI_API_KEY del entorno `staging`.
# Ningún script imprime la clave; solo el del prompt imprime la respuesta del modelo, y únicamente cuando
# una comprobación falla (son preguntas sintéticas sobre políticas públicas).
# Corre solo a mano o cuando cambia el propio script.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'asistente-ia/scripts/verificar-gemini.mjs'
      - 'asistente-ia/scripts/verificar-cliente-gemini.mjs'
      - 'asistente-ia/scripts/verificar-herramientas-gemini.mjs'
      - 'asistente-ia/scripts/verificar-prompt-gemini.mjs'
      - 'asistente-ia/prompts/**'
      - 'asistente-ia/conocimiento/**'
      - 'server/api/lib/asistente.ts'
      - 'server/api/lib/herramientas-asistente.ts'
      - 'server/api/lib/gemini.ts'
      - 'server/api/lib/proveedor-llm.ts'
      - 'server/api/lib/indice-vectorial.ts'
      - '.github/workflows/asistente-verificar-gemini.yml'

permissions:
  contents: read

jobs:
  verificar:
    name: Verificar Gemini
    runs-on: ubuntu-24.04
    environment:
      name: staging
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verificar contrato (HTTP directo)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node asistente-ia/scripts/verificar-gemini.mjs
      - name: Verificar el llamado de herramientas (HTTP directo)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node asistente-ia/scripts/verificar-herramientas-gemini.mjs
      - name: Instalar dependencias y compilar el backend
        run: |
          npm ci
          npm run build:api
      - name: Verificar el cliente real (ProveedorGemini)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node asistente-ia/scripts/verificar-cliente-gemini.mjs
      - name: Verificar el prompt vigente con el modelo real (horarios y políticas)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node asistente-ia/scripts/verificar-prompt-gemini.mjs
