    description: >-
      PUT /api/libros/:bookId — edita ubicacionId/cantidadTotal/pvp/
      porcentajeDescuentoEditorial de un libro, exige rol vendedor o
      administrador (CLAUDE.md A01, ADR-008, área "Gestionar" pestaña
      "Editar"). Reemplaza a cambiarUbicacionLibro.
    environment:
      TABLA_LIBROS: ${self:custom.nombresTablas.libros}
      TABLA_UBICACIONES: ${self:custom.nombresTablas.ubicaciones}
      TABLA_USUARIOS: ${self:custom.nombresTablas.usuarios}
      FIREBASE_SERVICE_ACCOUNT_BABEL: ${env:FIREBASE_SERVICE_ACCOUNT_BABEL, ''}
    package:
