                    - !GetAtt TablaUsuarios.Arn

    ExportarVentasLambdaRole:
      Type: AWS::IAM::Role
      Properties:
        RoleName: babel-exportar-ventas-role-${sls:stage}
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal:
                Service: lambda.amazonaws.com
              Action: sts:AssumeRole
        ManagedPolicyArns:
          - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        Policies:
          # Mismo alcance de solo lectura que ListarVentasLambdaRole: Scan
          # sobre babel-ventas, GetItem puntual sobre babel-libros (resolver
          # título/editorial por bookId) y sobre babel-usuarios (resolver el
          # rol del token) — sin acceso de escritura a ninguna tabla
          # (CLAUDE.md A05, ADR-008).
          - PolicyName: babel-exportar-ventas-dynamodb-${sls:stage}
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - dynamodb:Scan
                  Resource:
                    - !GetAtt TablaVentas.Arn
                - Effect: Allow
                  Action:
                    - dynamodb:GetItem
                  Resource:
                    - !GetAtt TablaLibros.Arn
                    - !GetAtt TablaUsuarios.Arn

    SsrLambdaRole:
      Type: AWS::IAM::Role
      Properties:
        RoleName: babel-ssr-role-${sls:stage}
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal:
                Service: lambda.amazonaws.com
              Action: sts:AssumeRole
        ManagedPolicyArns:
          - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        # Sin políticas adicionales: el SSR solo renderiza, no accede a DynamoDB.

    # --- Tablas DynamoDB (tech-specs.md §5.1) ---
    # PAY_PER_REQUEST (on-demand) OBLIGATORIO en todas. No cambiar a PROVISIONED.
    #
    # Antes estaban en PROVISIONED 25/25 bajo la premisa (falsa) de que esa
    # capacidad era "capa siempre gratuita". Costó US$90 en julio de 2026:
    # el límite gratuito de 25 RCU + 25 WCU es POR CUENTA, no por tabla, y
    # aquí había 8 tablas × 2 stages + 2 GSIs = 18 unidades de 25/25
    # (450 RCU + 450 WCU, 18× el límite) a US$0.468/día cada una = US$8.42/día
    # = ~US$256/mes, cobrados 24/7 aunque nadie usara la app. Además, AWS
    # retiró ese "always free" de DynamoDB en 2025 para cuentas nuevas.
    #
    # Con on-demand se paga por operación: el inventario completo de ~3.000
    # libros cuesta centavos al mes. Ver docs/advertencia-urgente-costos-aws.md.
    TablaLibros:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:custom.nombresTablas.libros}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: bookId
            AttributeType: S
          - AttributeName: isbn
            AttributeType: S
        KeySchema:
          - AttributeName: bookId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: isbn-index
            KeySchema:
              - AttributeName: isbn
                KeyType: HASH
            Projection:
              ProjectionType: ALL
            # Sin ProvisionedThroughput: en PAY_PER_REQUEST el GSI hereda el
            # modo de la tabla, y declararlo aquí hace fallar el despliegue.

    TablaVentas:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:custom.nombresTablas.ventas}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: ventaId
            AttributeType: S
        KeySchema:
          - AttributeName: ventaId
            KeyType: HASH
        # Sin GSI a propósito: el vendidoEn-index original (vendidoEn como
        # única clave de partición, sin sort key) nunca admitió Query por
        # rango — solo igualdad exacta de un timestamp con milisegundos,
        # inservible para reportes — y aún así reservaba 25/25 RCU/WCU
        # propios y duplicaba el almacenamiento de cada venta, contra el
        # objetivo de costo $0. GET /api/ventas filtra por rango de fecha
        # con Scan + filtrado en memoria (criterio de tablas pequeñas, ver
        # MEMORY.md §6/§7); si el volumen algún día lo exige, diseñar un
        # GSI real con partición fija + vendidoEn como clave de rango.

    TablaEspacios:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:custom.nombresTablas.espacios}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: espacioId
            AttributeType: S
        KeySchema:
          - AttributeName: espacioId
            KeyType: HASH

    TablaMuebles:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:custom.nombresTablas.muebles}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: muebleId
            AttributeType: S
        KeySchema:
          - AttributeName: muebleId
            KeyType: HASH

    TablaUbicaciones:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:custom.nombresTablas.ubicaciones}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: ubicacionId
            AttributeType: S
        KeySchema:
          - AttributeName: ubicacionId
            KeyType: HASH

    TablaEditorialesDescuentos:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:custom.nombresTablas.editorialesDescuentos}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: editorial
            AttributeType: S
        KeySchema:
          - AttributeName: editorial
            KeyType: HASH

    TablaSitiosScraping:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:custom.nombresTablas.sitiosScraping}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: dominio
            AttributeType: S
        KeySchema:
          - AttributeName: dominio
            KeyType: HASH

    TablaUsuarios:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:custom.nombresTablas.usuarios}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: email
            AttributeType: S
        KeySchema:
          - AttributeName: email
            KeyType: HASH

    # --- Dominio personalizado babel.letiende.co (solo stage production, PRD.md §6) ---
    # Condicionado a EsProduccion porque staging sigue usando la URL cruda de API Gateway
    # (no tiene sentido pagar/gestionar un dominio propio para un ambiente de pruebas).
    # El certificado se valida automáticamente por DNS: al declarar HostedZoneId dentro
    # de DomainValidationOptions, CloudFormation crea el registro de validación en Route53
    # por su cuenta y espera a que ACM lo emita, sin intervención manual.
    CertificadoBabelDominio:
      Type: AWS::CertificateManager::Certificate
      Condition: EsProduccion
      Properties:
        DomainName: babel.letiende.co
        ValidationMethod: DNS
        DomainValidationOptions:
          - DomainName: babel.letiende.co
            HostedZoneId: Z010633738KAGFIPOZVEW

    DominioPersonalizadoBabel:
      Type: AWS::ApiGatewayV2::DomainName
      Condition: EsProduccion
      Properties:
        DomainName: babel.letiende.co
        DomainNameConfigurations:
          - CertificateArn: !Ref CertificadoBabelDominio
            EndpointType: REGIONAL
            SecurityPolicy: TLS_1_2

    MapeoApiDominioBabel:
      Type: AWS::ApiGatewayV2::ApiMapping
      Condition: EsProduccion
      Properties:
        ApiId: !Ref HttpApi
        DomainName: !Ref DominioPersonalizadoBabel
        Stage: $default

    RegistroDnsBabel:
      Type: AWS::Route53::RecordSet
      Condition: EsProduccion
      Properties:
        HostedZoneId: Z010633738KAGFIPOZVEW
        Name: babel.letiende.co
        Type: A
        AliasTarget:
          DNSName: !GetAtt DominioPersonalizadoBabel.RegionalDomainName
          HostedZoneId: !GetAtt DominioPersonalizadoBabel.RegionalHostedZoneId
          EvaluateTargetHealth: false
