        - 'dist-server/api/handlers/libros.js'
        - 'dist-server/api/lib/verificar-token.js'
        - 'dist-server/api/services/dynamodb.js'
        # Misma función (libros.ts) que GET/POST/DELETE/inventario — mismo
        # cuidado documentado arriba (MEMORY.md §7): un import nuevo a nivel
        # superior afecta a todas las funciones Lambda que comparten este
        # archivo, no solo esta.
        - 'node_modules/**'
        # Recorta paquetes solo-frontend/dev-tooling — lista completa y
