        - 'dist-server/api/handlers/libros.js'
        - 'dist-server/api/lib/verificar-token.js'
        - 'dist-server/api/services/dynamodb.js'
        # Misma función (libros.ts) que GET/POST/PUT/DELETE/inventario/
        # exportar/por-isbn — mismo cuidado documentado arriba (MEMORY.md §7).
