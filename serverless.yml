  ssr:
    handler: server/ssr/handler.handler
    role: !GetAtt SsrLambdaRole.Arn
    description: >-
      Renderizado SSR de Angular (catálogo público + app shell autenticada).
      Sin permisos de DynamoDB: solo renderiza, no accede a datos directamente.
    memorySize: 512
    environment:
      # Protección SSRF de Angular (`AngularNodeAppEngine`) exige una lista
      # explícita de hosts permitidos. En producción el tráfico llega tanto
      # por el dominio personalizado (`babel.letiende.co`) como por el
      # hostname crudo de API Gateway (respaldo), así que se autorizan
      # ambos. En staging/dev, sin dominio personalizado, solo el crudo.
      NG_ALLOWED_HOSTS: !If
        - EsProduccion
        - !Sub '${HttpApi}.execute-api.${AWS::Region}.amazonaws.com,babel.letiende.co'
        - !Sub '${HttpApi}.execute-api.${AWS::Region}.amazonaws.com'
    package:
      patterns:
        - '!**'
        - 'dist/babel-letiende/**'
        - 'server/ssr/handler.mjs'
        - 'node_modules/@codegenie/serverless-express/**'
    events:
      - httpApi:
          path: /
          method: get
      - httpApi:
          path: /{proxy+}
          method: '*'

resources:
  Conditions:
    EsProduccion: !Equals ['${sls:stage}', 'production']

  Resources:
    # --- Roles IAM de mínimo privilegio (uno por función) ---
    ApiLambdaRole:
      Type: AWS::IAM::Role
      Properties:
        RoleName: babel-api-role-${sls:stage}
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal:
                Service: lambda.amazonaws.com
              Action: sts:AssumeRole
        ManagedPolicyArns:
          - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        Policies:
          - PolicyName: babel-api-dynamodb-${sls:stage}
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - dynamodb:GetItem
                    - dynamodb:PutItem
                    - dynamodb:UpdateItem
                    - dynamodb:DeleteItem
                    - dynamodb:Query
                    - dynamodb:Scan
                    - dynamodb:BatchGetItem
                    - dynamodb:BatchWriteItem
                  Resource:
                    - !GetAtt TablaLibros.Arn
                    - !Sub '${TablaLibros.Arn}/index/*'
                    - !GetAtt TablaVentas.Arn
                    - !GetAtt TablaEditorialesDescuentos.Arn
                    - !GetAtt TablaSitiosScraping.Arn
                    - !GetAtt TablaUsuarios.Arn

    UsuariosMeLambdaRole:
      Type: AWS::IAM::Role
      Properties:
        RoleName: babel-usuarios-me-role-${sls:stage}
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal:
                Service: lambda.amazonaws.com
              Action: sts:AssumeRole
        ManagedPolicyArns:
          - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        Policies:
